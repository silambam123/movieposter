<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanos Poster</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#000;
}
.poster{
    width:420px;
    height:650px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    box-shadow:0 0 25px gold;
}
.poster img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.overlay{
    position:absolute;
    bottom:0;
    width:100%;
    padding:30px;
    background:linear-gradient(transparent,rgba(0,0,0,.95));
    color:#fff;
}
.overlay h1{
    color:#FFD700;
    font-size:48px;
}
.overlay h2{
    margin:10px 0;
}
.overlay p{
    margin:15px 0;
}
.button{
    display:inline-block;
    background:#FFD700;
    color:#000;
    padding:12px 25px;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="poster">
    <img src="C:\Users\user\OneDrive\Pictures\wp6243891-thanos-computer-wallpapers.jpg" alt="Poster Image">
    <div class="overlay">
        <h1>THANOS</h1>
        <h2>THE MAD TITAN</h2>
        <p>"I Am Inevitable."</p>
        <a href="#" class="button">WATCH NOW</a>
    </div>
</div>

</body>
</html>
